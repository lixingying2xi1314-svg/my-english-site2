        function App() {
            const [allSentences, setAllSentences] = useState([]);
            // 从 LocalStorage 读取历史进度，如果没有则从 0 开始
            const [index, setIndex] = useState(() => {
                const saved = localStorage.getItem('fluent_type_progress');
                return saved ? parseInt(saved, 10) : 0;
            });
            const [loading, setLoading] = useState(true);
            const [input, setInput] = useState("");
            const [isError, setIsError] = useState(false);
            const [hintIndices, setHintIndices] = useState([]);
            const inputRef = useRef(null);

            // 加载外部 JSON
            useEffect(() => {
                fetch('sentences.json')
                    .then(res => res.json())
                    .then(data => {
                        setAllSentences(data);
                        setLoading(false);
                    })
                    .catch(() => {
                        setAllSentences(FALLBACK_DATA);
                        setLoading(false);
                    });
            }, []);

            // 每当 index 改变时，自动存入 LocalStorage
            useEffect(() => {
                localStorage.setItem('fluent_type_progress', index);
            }, [index]);

            const current = allSentences[index];
            const targetSentence = current ? current.s.toLowerCase() : "";

            const speak = (text) => {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            };

            useEffect(() => {
                if (current) {
                    speak(current.s);
                    setHintIndices([]);
                    setInput("");
                    setIsError(false);
                    inputRef.current?.focus();
                }
            }, [index, current]);

            const handleInput = (e) => {
                const val = e.target.value.toLowerCase();
                if (val && !targetSentence.startsWith(val)) {
                    setIsError(true);
                    return;
                }
                setIsError(false);
                setInput(val);

                if (val === targetSentence) {
                    setTimeout(() => setIndex(prev => (prev + 1) % allSentences.length), 500);
                }
            };

            const skipSentence = () => {
                setIndex(prev => (prev + 1) % allSentences.length);
            };

            const jumpToProgress = () => {
                const target = prompt("输入你想跳转的题号 (1 - " + allSentences.length + "):");
                const num = parseInt(target, 10);
                if (num > 0 && num <= allSentences.length) {
                    setIndex(num - 1);
                }
            };

            const showHint = () => {
                const remaining = targetSentence.slice(input.length);
                const nextSpaceIdx = remaining.indexOf(" ");
                const wordToHint = nextSpaceIdx === -1 ? remaining : remaining.slice(0, nextSpaceIdx + 1);
                const startIdx = input.length;
                const newHints = [];
                for(let i=0; i<wordToHint.length; i++) newHints.push(startIdx + i);
                setHintIndices([...hintIndices, ...newHints]);
                setInput(input + wordToHint);
                setIsError(false);
                inputRef.current.focus();
            };

            if (loading) return <div className="flex h-screen items-center justify-center text-indigo-500 font-bold">LOADING...</div>;

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6" onClick={() => inputRef.current.focus()}>
                    <div className="w-full max-w-5xl">
                        {/* 顶部状态栏 */}
                        <div className="flex justify-between items-end mb-12">
                            <div className="text-left">
                                <span className="text-indigo-500 font-black text-xs tracking-widest uppercase italic">Level: CET-6 Social</span>
                                <h2 className="text-3xl font-bold text-white mt-2 leading-tight">{current.m}</h2>
                            </div>
                            <div className="text-right cursor-pointer hover:text-white transition-colors" onClick={jumpToProgress}>
                                <p className="text-[10px] text-zinc-500 font-bold uppercase mb-1">Click to Jump</p>
                                <span className="text-xl font-black text-indigo-400 font-mono">#{index + 1}</span>
                                <span className="text-zinc-600 text-sm"> / {allSentences.length}</span>
                            </div>
                        </div>

                        {/* 拼写区域 */}
                        <div className="flex flex-wrap justify-center gap-x-6 gap-y-10 mb-12">
                            {current.s.split(" ").map((word, wIdx, wordsArr) => {
                                let prevCharsCount = wordsArr.slice(0, wIdx).join(" ").length + (wIdx > 0 ? 1 : 0);
                                return (
                                    <div key={wIdx} className="flex">
                                        {word.split("").map((letter, lIdx) => {
                                            const gIdx = prevCharsCount + lIdx;
                                            const isFilled = input.length > gIdx;
                                            const isActive = input.length === gIdx;
                                            const wasHinted = hintIndices.includes(gIdx);
                                            return (
                                                <span key={lIdx} className={`letter-slot ${isActive ? 'active' : ''} ${isFilled ? (wasHinted ? 'hinted' : 'correct') : ''} ${isActive && isError ? 'error' : ''}`}>
                                                    {isFilled ? targetSentence[gIdx] : ""}
                                                </span>
                                            );
                                        })}
                                        {wIdx < wordsArr.length - 1 && <span className="w-6 text-center text-zinc-800">·</span>}
                                    </div>
                                );
                            })}
                        </div>

                        {/* 交互按钮组 */}
                        <div className="flex flex-col items-center gap-8 mt-12">
                            <div className="flex flex-wrap justify-center gap-4">
                                <button onClick={(e) => {e.stopPropagation(); speak(current.s);}} className="btn-ctrl">
                                    <i className="fas fa-volume-up mr-2"></i>重听全句
                                </button>
                                <button onClick={(e) => {e.stopPropagation(); showHint();}} className="btn-ctrl border-indigo-900/50 text-indigo-400">
                                    <i className="fas fa-lightbulb mr-2"></i>单词提示
                                </button>
                                <button onClick={(e) => {e.stopPropagation(); skipSentence();}} className="btn-ctrl hover:bg-orange-950/20 hover:text-orange-400 hover:border-orange-900/50">
                                    <i className="fas fa-forward mr-2"></i>直接跳过
                                </button>
                            </div>
                            
                            <input ref={inputRef} type="text" value={input} onChange={handleInput} className="hidden-input" autoFocus />
                            <p className="text-[10px] text-zinc-700 font-bold tracking-[0.4em] uppercase">
                                {isError ? "检测到错误，请修改" : "输入对应的小写字母及符号"}
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
